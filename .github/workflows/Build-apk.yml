name: Build Lovable Offline APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build TanStack Start Web Project
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Package with Capacitor
        run: |
          npm install --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android

          # Clean and recreate dist directory
          rm -rf dist
          mkdir -p dist

          # Copy compiled TanStack Start client assets to dist
          if [ -d ".output/public" ]; then
            cp -r .output/public/* dist/
          fi

          # Find entry JS bundle
          JS_ENTRY=$(find dist -type f \( -name "client*.js" -o -name "entry-client*.js" -o -name "app*.js" -o -name "index*.js" \) | head -n 1)
          if [ -z "$JS_ENTRY" ]; then
            JS_ENTRY=$(find dist -type f -name "*.js" -exec ls -s {} + | sort -n -r | head -n 1 | awk '{print $2}')
          fi

          # Get relative path for script tag
          JS_REL=""
          if [ -n "$JS_ENTRY" ]; then
            JS_REL="/$(echo "$JS_ENTRY" | sed 's|^dist/||')"
          fi

          # Get relative paths for stylesheet link tags
          CSS_TAGS=""
          for css_file in $(find dist -type f -name "*.css"); do
            CSS_REL="/$(echo "$css_file" | sed 's|^dist/||')"
            CSS_TAGS="${CSS_TAGS}<link rel=\"stylesheet\" href=\"${CSS_REL}\">\n"
          done

          # Create static index.html required by Capacitor
          cat <<HTML > dist/index.html
          <!DOCTYPE html>
          <html lang="en">
            <head>
              <meta charset="UTF-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
              <title>Twilight App</title>
              $(echo -e "$CSS_TAGS")
            </head>
            <body>
              <div id="root"></div>
              <div id="app"></div>
              $(if [ -n "$JS_REL" ]; then echo "<script type=\"module\" src=\"$JS_REL\"></script>"; fi)
            </body>
          </html>
          HTML

          # Configure Capacitor to read from dist
          cat <<EOF > capacitor.config.json
          {
            "appId": "com.twilight.app",
            "appName": "Twilight App",
            "webDir": "dist"
          }
          EOF

          npx cap add android
          npx cap sync android

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Compile Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Save APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: twilight-offline-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
