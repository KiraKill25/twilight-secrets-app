name: Build Lovable Offline APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Lovable Web Project
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Package with Capacitor
        run: |
          npm install --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android

          WEB_DIR=".output/public"
          if [ ! -d "$WEB_DIR" ]; then
            if [ -d "dist" ]; then WEB_DIR="dist";
            elif [ -d "build" ]; then WEB_DIR="build";
            else WEB_DIR="public"; fi
          fi

          echo "Using web dir: $WEB_DIR"

          cat <<EOF > capacitor.config.json
          {
            "appId": "com.twilight.app",
            "appName": "Twilight App",
            "webDir": "$WEB_DIR"
          }
          EOF

          npx cap add android
          npx cap sync android

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Compile Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Save APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: twilight-offline-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
