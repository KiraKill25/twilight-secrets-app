name: Build Lovable Offline APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build Lovable Web Project
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Package with Capacitor
        run: |
          npm install --legacy-peer-deps @capacitor/core @capacitor/cli @capacitor/android

          # Create guaranteed dist folder
          mkdir -p dist

          # Copy compiled Lovable assets into dist
          if [ -d ".output/public" ]; then
            cp -r .output/public/* dist/
          fi

          # Ensure index.html exists inside dist
          if [ ! -f "dist/index.html" ]; then
            if [ -f "index.html" ]; then
              cp index.html dist/index.html
            elif [ -f "public/index.html" ]; then
              cp public/index.html dist/index.html
            else
              cat <<'HTML' > dist/index.html
    <!DOCTYPE html>
    <html lang="en">
      <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Twilight App</title>
      </head>
      <body>
        <div id="root"></div>
      </body>
    </html>
    HTML
            fi
          fi

          # Force Capacitor to read from dist
          cat <<EOF > capacitor.config.json
          {
            "appId": "com.twilight.app",
            "appName": "Twilight App",
            "webDir": "dist"
          }
          EOF

          npx cap add android
          npx cap sync android

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Compile Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Save APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: twilight-offline-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
